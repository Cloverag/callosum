# Callosum public demo stack — home server (2 cores, 5.8GB).
#
# Differences from docker-compose.yml, all forced by the hardware or by the fact
# that this one is reachable from the internet:
#
#   * NO KEYCLOAK. A second JVM beside Neo4j on two Core 2 Duo cores makes cold
#     start minutes and every request seconds. The demo authenticates by principal
#     selection instead; production OIDC is unchanged and still configured by
#     MERIDIAN_OIDC_* when a real IdP exists.
#   * Neo4j is tuned down to a 512m heap + 256m page cache. Correct for a demo
#     graph, badly wrong for ingest — do ingest on your main machine and restore
#     a dump here.
#   * NOTHING IS PUBLISHED TO THE HOST. cloudflared joins this network and reaches
#     `api:8000` directly, so there is no listening port on the LAN and no
#     inbound firewall rule anywhere.
#   * ENVIRONMENT=production is pinned on the api service. This is load-bearing:
#     meridian/api/deps.py defaults it to "development", which is the permissive
#     side of the MERIDIAN_DEV_AUTO_AUTH bypass. Do not remove this line.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: callosum-demo-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: callosum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.demo}
      POSTGRES_DB: callosum
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callosum -d callosum"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: callosum-demo-neo4j
    restart: unless-stopped
    mem_limit: 1500m
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env.demo}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      # Tuned for this box. Neo4j's own advice for a 2-core machine is to leave
      # headroom for Postgres and the API rather than let the JVM take what it wants.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    # `image` names the tag; `build` is the fallback when that tag is absent. On the
    # server the tag is already present (docker load), so compose starts it and never
    # builds — a Core 2 Duo compiling psycopg and pydantic-core wheels takes tens of
    # minutes. On a dev machine without the tag, compose builds it. Both work from
    # the one file, so nothing has to be edited between environments.
    image: callosum-api:demo
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: callosum-demo-api
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env.demo
    environment:
      # --- defence-in-depth ----------------------------------------------
      # deps.py USED to default ENVIRONMENT to "development" and treat any
      # non-production value as eligible for the MERIDIAN_DEV_AUTO_AUTH bypass,
      # which authenticated a session-less request as the first principal (Raj,
      # founder, clearance 4). That was #191, fixed in #192: the default is now
      # fail-closed and auto-auth requires an explicit environment allowlist.
      #
      # This pin is therefore now redundant belt-and-braces rather than the only
      # thing holding the line. Keep it: it costs nothing, and it means this
      # deployment does not depend on that fix staying correct.
      ENVIRONMENT: production
      APP_ENV: production
      # -------------------------------------------------------------------
      # Container-internal hostnames. The DSNs in .env.demo point at 127.0.0.1 for
      # local work; inside compose the services resolve by name instead.
      POSTGRES_DSN: postgresql://callosum:${POSTGRES_PASSWORD}@postgres:5432/callosum?connect_timeout=10
      POSTGRES_APP_DSN: postgresql://callosum_app:${POSTGRES_APP_PASSWORD}@postgres:5432/callosum?connect_timeout=10
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MERIDIAN_SESSION_HTTPS_ONLY: "true"
      # Impersonation endpoint, on purpose, and safe ONLY because this stack serves
      # fabricated demo minutes. Sourced from .env.demo so it is a deployment decision
      # rather than a baked-in default. See #191: the last affordance that let an
      # anonymous request become the founder was on by default; this one is not.
      MERIDIAN_DEMO_SELECTOR: ${MERIDIAN_DEMO_SELECTOR:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: callosum-demo-tunnel
    restart: unless-stopped
    mem_limit: 128m
    # Token auth: no credentials file is mounted and nothing secret lives in this repo.
    #
    # --url is the origin, and it is REQUIRED here. A tunnel created with
    # `cloudflared tunnel create` is locally-managed and carries no remote ingress
    # configuration, so a token run has no route and the edge answers 503 for every
    # path — the tunnel connects and registers happily, which makes it look like a
    # backend fault rather than a missing route. --url supplies the origin directly,
    # so the deployment does not depend on a public hostname having been added in the
    # dashboard. Adding one there anyway is harmless: remote config takes precedence.
    #
    # `api:8000` is the container name on this network. `localhost` would resolve to
    # cloudflared's own container.
    command: tunnel --no-autoupdate run --url http://api:8000 --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.demo}
    depends_on:
      - api

volumes:
  pgdata:
  neo4jdata:
