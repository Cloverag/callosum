name: CI

on:
  push:
    branches: [ master ]
  # NO `branches:` filter here, deliberately. With `branches: [ master ]` a pull
  # request whose BASE is not master never triggers, so a stacked PR gets no checks
  # at all -- and GitHub renders "no checks reported", which reads as "nothing to
  # run" rather than "never asked to run". #154, #155 and #156 sat green-looking and
  # entirely unverified because of this.
  #
  # `push` stays scoped to master on purpose: unfiltered, every branch push would
  # duplicate the run the pull_request event already does.
  pull_request:

jobs:
  backend-ci:
    name: Backend CI (Python 3.12 + Postgres & Neo4j)
    runs-on: ubuntu-latest

    env:
      CALLOSUM_POSTGRES_DSN: postgresql://callosum:callosum@localhost:5432/callosum
      CALLOSUM_POSTGRES_APP_DSN: postgresql://callosum_app:callosum_app@localhost:5432/callosum
      CALLOSUM_NEO4J_URI: bolt://localhost:7687
      CALLOSUM_NEO4J_USER: neo4j
      CALLOSUM_NEO4J_PASSWORD: callosum123

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callosum
          POSTGRES_PASSWORD: callosum
          POSTGRES_DB: callosum
        ports:
          - 5432:5432
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/callosum123
        ports:
          - 7687:7687

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize Base Schema, Migrations & Constraints
        run: |
          PGPASSWORD=callosum psql -h localhost -U callosum -d callosum -f schema/postgres.sql
          alembic upgrade head
          callosum init

      # Condition 5 of the downgrade-correction rule in CONTRIBUTING.md: a correction
      # is permitted only if a forward-and-reverse chain test covers it. This is that
      # test, and it is the reason #165 and #173 went unnoticed for months — the chain
      # had never been reversed anywhere, so every downgrade() in the repo was
      # unverified. Two were checked and both were wrong.
      #
      # Runs against its own scratch database so the suite's database is untouched,
      # and sets POSTGRES_DSN rather than CALLOSUM_POSTGRES_DSN because
      # src/callosum/config.py declares no env_prefix (#171).
      - name: Migration chain reverses (down to base, then back up)
        env:
          POSTGRES_DSN: postgresql://callosum:callosum@localhost:5432/callosum_chain
          POSTGRES_APP_DSN: postgresql://callosum_app:callosum_app@localhost:5432/callosum_chain
        run: |
          set -euo pipefail
          PGPASSWORD=callosum createdb -h localhost -U callosum callosum_chain
          PGPASSWORD=callosum psql -h localhost -U callosum -d callosum_chain -q -f schema/postgres.sql
          echo "--- forward ---"
          alembic upgrade head
          echo "--- reverse (this is the leg that was never run) ---"
          alembic downgrade base
          echo "--- forward again, to prove the reverse left a usable database ---"
          alembic upgrade head

      # Runs both fast unit tests and gated integration tests (closes #123).
      # Note: Live LLM tests remain excluded automatically via pyproject.toml's default addopts = "-m 'not llm'".
      - name: Run Pytest Suite (Gated Integration Suite)
        env:
          CALLOSUM_RUN_INTEGRATION: "1"
        run: |
          pytest -q

  frontend-ci:
    name: Frontend CI (Next.js & Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: ./frontend
        run: npm test
        env:
          CI: true

      - name: Clean & Build Next.js Bundle
        working-directory: ./frontend
        run: |
          rm -rf .next
          npm run build
        env:
          CI: true
