name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-ci:
    name: Backend CI (Python 3.12 + Postgres pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callosum_app
          POSTGRES_PASSWORD: callosum_password
          POSTGRES_DB: callosum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Initialize Database Schema
        run: |
          callosum init
        env:
          CALLOSUM_POSTGRES_HOST: localhost
          CALLOSUM_POSTGRES_PORT: 5432
          CALLOSUM_POSTGRES_USER: callosum_app
          CALLOSUM_POSTGRES_PASSWORD: callosum_password
          CALLOSUM_POSTGRES_DB: callosum_test

      - name: Run Pytest Suite
        run: |
          pytest -m "not llm" -q
        env:
          CALLOSUM_POSTGRES_HOST: localhost
          CALLOSUM_POSTGRES_PORT: 5432
          CALLOSUM_POSTGRES_USER: callosum_app
          CALLOSUM_POSTGRES_PASSWORD: callosum_password
          CALLOSUM_POSTGRES_DB: callosum_test

  frontend-ci:
    name: Frontend CI (Next.js & Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: ./frontend
        run: npm test

      - name: Build Next.js Bundle
        working-directory: ./frontend
        run: npm run build
