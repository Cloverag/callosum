name: CI

on:
  push:
    branches: [ master ]
  # NO `branches:` filter here, deliberately. With `branches: [ master ]` a pull
  # request whose BASE is not master never triggers, so a stacked PR gets no checks
  # at all -- and GitHub renders "no checks reported", which reads as "nothing to
  # run" rather than "never asked to run". #154, #155 and #156 sat green-looking and
  # entirely unverified because of this.
  #
  # `push` stays scoped to master on purpose: unfiltered, every branch push would
  # duplicate the run the pull_request event already does.
  pull_request:

jobs:
  backend-ci:
    name: Backend CI (Python 3.12 + Postgres & Neo4j)
    runs-on: ubuntu-latest

    env:
      POSTGRES_DSN: postgresql://callosum:callosum@localhost:5432/callosum
      POSTGRES_APP_DSN: postgresql://callosum_app:callosum_app@localhost:5432/callosum
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: callosum123

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callosum
          POSTGRES_PASSWORD: callosum
          POSTGRES_DB: callosum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/callosum123
        ports:
          - 7687:7687

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Same spirit as frontend `npm audit --omit=dev --audit-level=critical`:
      # known advisories in the installed runtime graph fail the job. There is
      # no severity flag on pip-audit equivalent to npm's `--audit-level`.
      - name: Audit Python dependencies for known advisories
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner off --skip-editable

      - name: Initialize Base Schema, Migrations & Constraints
        run: |
          PGPASSWORD=callosum psql -h localhost -U callosum -d callosum -f schema/postgres.sql
          alembic upgrade head
          callosum init

      # Runs both fast unit tests and gated integration tests (closes #123).
      # Note: Live LLM tests remain excluded automatically via pyproject.toml's default addopts = "-m 'not llm'".
      - name: Run Pytest Suite (Gated Integration Suite)
        env:
          CALLOSUM_RUN_INTEGRATION: "1"
        run: |
          pytest -q

  # Condition 5 of the downgrade-correction rule in CONTRIBUTING.md: a downgrade may
  # be corrected only if a forward-and-reverse chain test covers it. This is that test.
  #
  # It exists because the chain had never been reversed anywhere, so every downgrade()
  # in this repository was unverified. Two were checked (#165, #173) and both were wrong,
  # and the second was only visible once the first was fixed.
  #
  # WHY ITS OWN JOB AND NOT A STEP IN backend-ci. `0004_app_role` creates the
  # `callosum_app` role and its downgrade drops it. Postgres roles are CLUSTER-wide, not
  # per-database — so a scratch database sharing a cluster with the suite's database
  # cannot complete the reverse leg: DROP ROLE fails with DependentObjectsStillExist
  # against the OTHER database's objects. A separate job gets a separate service
  # container, which is the only way `downgrade base` means what it says.
  migration-chain:
    name: Migration chain reverses (full, down to base and back)
    runs-on: ubuntu-latest

    env:
      # `src/callosum/config.py` has no env_prefix; CALLOSUM_POSTGRES_DSN is ignored.
      POSTGRES_DSN: postgresql://callosum:callosum@localhost:5432/callosum
      POSTGRES_APP_DSN: postgresql://callosum_app:callosum_app@localhost:5432/callosum

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: callosum
          POSTGRES_PASSWORD: callosum
          POSTGRES_DB: callosum
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Base schema
        run: PGPASSWORD=callosum psql -h localhost -U callosum -d callosum -q -f schema/postgres.sql

      - name: Forward — every migration applies
        run: alembic upgrade head

      - name: Reverse — every downgrade is a faithful inverse
        run: alembic downgrade base

      - name: Forward again — the reverse left a usable database
        run: alembic upgrade head

  frontend-ci:
    name: Frontend CI (Next.js & Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Jest Test Suite
        working-directory: ./frontend
        run: npm test
        env:
          CI: true

      - name: Audit production dependencies for critical advisories
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Clean & Build Next.js Bundle
        working-directory: ./frontend
        run: |
          rm -rf .next
          npm run build
        env:
          CI: true
