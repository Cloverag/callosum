# CodeQL — static analysis for Python and the Next.js app.
#
# Not a substitute for the gated pytest suite or `npm audit`. Enable GitHub
# code scanning in Settings if alerts do not appear after the first run.

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday 07:17 UTC — off the CI rush, weekly enough for a prototype.
    - cron: "17 7 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
