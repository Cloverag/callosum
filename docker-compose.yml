services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: callosum-postgres
    environment:
      POSTGRES_USER: callosum
      POSTGRES_PASSWORD: callosum
      POSTGRES_DB: callosum
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callosum -d callosum"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: callosum-neo4j
    environment:
      NEO4J_AUTH: neo4j/callosum123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser  -> http://localhost:7474
      - "127.0.0.1:7687:7687"   # Bolt driver
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Identity provider for the P3 authenticated API (ADR-009). Development only:
  # `start-dev` runs with an in-memory H2 database and no TLS, so nothing here
  # survives a restart and nothing here belongs in front of real users.
  #
  # The realm, client and a test user are imported from keycloak/realm-dev.json so
  # `docker compose up` gives a working IdP rather than a console to click through.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: callosum-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"   # Keycloak admin + realm -> http://localhost:8080
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  neo4jdata:
