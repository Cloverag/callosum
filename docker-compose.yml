services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: callosum-postgres
    environment:
      POSTGRES_USER: callosum
      POSTGRES_PASSWORD: callosum
      POSTGRES_DB: callosum
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callosum -d callosum"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: callosum-neo4j
    environment:
      NEO4J_AUTH: neo4j/callosum123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"   # Neo4j Browser  -> http://localhost:7474
      - "7687:7687"   # Bolt driver
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  neo4jdata:
